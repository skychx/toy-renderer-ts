    <title>day1：环境搭建</title>

  <body>
    <main>
      <h1>day1：环境搭建</h1>
      <div class="render-grid">
        <figure style="--figure-width: 400px">
          <!-- 画布只有 100×100，这里放大 4 倍显示，image-rendering: pixelated 让放大后的像素保持清晰的方块 -->
          <div class="canvas-stage" aria-busy="true">
            <canvas id="dot" width="100" height="100" class="pixelated"></canvas>
            <p class="canvas-status" role="status">正在绘制…</p>
          </div>
          <figcaption>在 (52, 41) 画一个红点（放大 4 倍显示）</figcaption>
        </figure>
      </div>
    </main>

      await runLesson(() => import('./main.ts'));
    </script>
