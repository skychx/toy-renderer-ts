<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>番外：软渲染器性能优化</title>
    <link rel="stylesheet" href="../../shared/lesson.css" />
  </head>
  <body>
    <main>
      <h1>番外：软渲染器性能优化</h1>
      <p>在任意一块画布上按住鼠标拖动，可以从不同的角度看模型，两边的相机是同步的</p>
      <p>
        左侧使用优化后的软渲染器；<a href="/extra-webgpu">查看未优化版本</a>。两版分辨率均为
        800×800。
      </p>
      <p id="gpu-status" class="sr-only" role="status" hidden></p>
      <div class="render-grid">
        <figure>
          <div class="canvas-stage" aria-busy="true">
            <canvas id="software" width="800" height="800"></canvas>
            <p class="canvas-status" role="status">正在加载模型并渲染…</p>
          </div>
          <figcaption>
            软渲染器（优化后）<span id="software-fps" class="fps">-- FPS</span>
          </figcaption>
        </figure>
        <figure>
          <div class="canvas-stage" aria-busy="true">
            <canvas id="webgpu" width="800" height="800"></canvas>
            <p class="canvas-status" role="status">正在准备显卡并加载贴图…</p>
          </div>
          <figcaption>WebGPU <span id="webgpu-fps" class="fps">-- FPS</span></figcaption>
        </figure>
      </div>
    </main>
    <script type="module">
      import { runLesson } from '../../shared/lesson';
      await runLesson(() => import('./main.ts'));
    </script>
  </body>
</html>
