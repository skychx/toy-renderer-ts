<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>day9：阴影</title>
    <style>
      body {
        margin: 24px;
        font-family: sans-serif;
      }
      figure {
        display: inline-block;
        margin: 0 24px 24px 0;
        vertical-align: top;
      }
      canvas {
        border: 1px solid #ddd;
      }
    </style>
  </head>
  <body>
    <h1>day9：阴影</h1>
    <figure>
      <canvas id="depth"></canvas>
      <figcaption>shadow map：从光源看过去的深度</figcaption>
    </figure>
    <figure>
      <canvas id="no-shadow"></canvas>
      <figcaption>没有阴影</figcaption>
    </figure>
    <figure>
      <canvas id="no-bias"></canvas>
      <figcaption>不加 bias：shadow acne</figcaption>
    </figure>
    <figure>
      <canvas id="shadow"></canvas>
      <figcaption>加上 bias 以后的阴影</figcaption>
    </figure>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
